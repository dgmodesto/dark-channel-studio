name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:translations
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/scripts/smoke.sh
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          docker compose -f deploy/compose.yaml --env-file deploy/.env ps > evidence/compose-ps.txt || true
          curl -s http://127.0.0.1:8000/health > evidence/health.json || true
          docker compose -f deploy/compose.yaml --env-file deploy/.env logs --no-color > evidence/logs.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence
          path: evidence
      - if: always()
        run: bash deploy/scripts/reset.sh
