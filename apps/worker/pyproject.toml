[project]
name = "dcs-worker"
version = "0.1.0"
description = "Dark Channel Studio background worker"
requires-python = ">=3.12"
dependencies = [
  "dcs-common",
  "dcs-providers",
  "dcs-niche-templates",
  "arq>=0.26",
  "httpx>=0.27",
]

[tool.uv.sources]
dcs-common = { workspace = true }
dcs-providers = { workspace = true }
dcs-niche-templates = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_worker"]
