[project]
name = "dcs-worker"
version = "0.1.0"
description = "Dark Channel Studio background worker"
requires-python = ">=3.12"
dependencies = [
  "dcs-common",
  "arq>=0.26",
]

[tool.uv.sources]
dcs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_worker"]
