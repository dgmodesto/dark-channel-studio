[project]
name = "dcs-api"
version = "0.1.0"
description = "Dark Channel Studio API"
requires-python = ">=3.12"
dependencies = [
  "dcs-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "alembic>=1.13",
]

[tool.uv.sources]
dcs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_api"]
