[project]
name = "dcs-niche-templates"
version = "0.1.0"
description = "Niche templates as versioned data"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_niche_templates"]
