[project]
name = "dcs-orchestrator"
version = "0.1.0"
description = "Orchestrator interface and LangGraph adapter for the script pipeline"
requires-python = ">=3.12"
dependencies = [
  "dcs-providers",
  "dcs-niche-templates",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
dcs-providers = { workspace = true }
dcs-niche-templates = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_orchestrator"]
